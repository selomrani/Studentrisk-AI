x-airflow-common: &airflow-common
  build: .
  image: mental-health-airflow:latest

  environment: &airflow-common-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor

    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${AIRFLOW_DB_USER}:${AIRFLOW_DB_PASSWORD}@postgres/${AIRFLOW_DB_NAME}

    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"

    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}

    AIRFLOW__API__AUTH_BACKENDS: airflow.api.auth.backend.basic_auth,airflow.api.auth.backend.session

    # Makes `import src...` work from DAGs, since ./src is mounted at /opt/airflow/src.
    PYTHONPATH: /opt/airflow

    # Kaggle credentials for kagglehub (see .env.example). Not required for
    # public datasets, which download anonymously.
    KAGGLE_USERNAME: ${KAGGLE_USERNAME:-}
    KAGGLE_KEY: ${KAGGLE_KEY:-}
    # Persist the kagglehub download cache inside the mounted ./data directory.
    KAGGLEHUB_CACHE: /opt/airflow/data/.kagglehub

  volumes:
    - ./dags:/opt/airflow/dags
    - ./src:/opt/airflow/src
    - ./data:/opt/airflow/data
    - ./models:/opt/airflow/models
    - ./reports:/opt/airflow/reports
    # Optional: reuse the host's Kaggle credentials (uncomment if the directory
    # exists). Public datasets such as this one download without credentials.
    # - ${HOME}/.kaggle:/home/airflow/.kaggle:ro

  user: "${AIRFLOW_UID:-50000}:0"

  depends_on:
    postgres:
      condition: service_healthy

services:
  postgres:
    image: postgres:16

    environment:
      POSTGRES_USER: ${AIRFLOW_DB_USER}
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
      POSTGRES_DB: ${AIRFLOW_DB_NAME}

    volumes:
      - postgres-db-volume:/var/lib/postgresql/data

    healthcheck:
      test:
        - CMD
        - pg_isready
        - -U
        - ${AIRFLOW_DB_USER}
        - -d
        - ${AIRFLOW_DB_NAME}
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s

    restart: always

  # Runs once: creates/migrates the metadata DB and the initial admin user.
  airflow-init:
    <<: *airflow-common
    entrypoint: /entrypoint bash -c
    command:
      - |
        airflow db migrate
        airflow users create \
          --username "${_AIRFLOW_WWW_USER_USERNAME}" \
          --password "${_AIRFLOW_WWW_USER_PASSWORD}" \
          --firstname Admin \
          --lastname Admin \
          --role Admin \
          --email admin@example.com || echo "Admin user already exists"
    environment:
      <<: *airflow-common-env
      _AIRFLOW_WWW_USER_USERNAME: ${_AIRFLOW_WWW_USER_USERNAME:-airflow}
      _AIRFLOW_WWW_USER_PASSWORD: ${_AIRFLOW_WWW_USER_PASSWORD:-airflow}
    restart: "no"

  airflow-webserver:
    <<: *airflow-common
    command: webserver

    ports:
      - "8080:8080"

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    restart: always

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler

    depends_on:
      postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully

    restart: always

volumes:
  postgres-db-volume:
