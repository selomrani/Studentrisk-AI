[project]
name = "studentrisk-ai"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Soufyane El Omrani", email = "elomranisoufyan@gmail.com" }
]
requires-python = ">=3.11,<3.13"
dependencies = [
    "fg-data-profiling>=4.20.0",
    "ipykernel>=7.4.0",
    "ipywidgets>=8.1.9",
    "matplotlib>=3.11.2",
    "mlflow>=3.18.0",
    "numpy>=2.4.6",
    "pandas>=2.2,<3.0",
    "seaborn>=0.13.2",
    "xgboost>=3.2.0",
]

[project.scripts]
studentrisk-ai = "studentrisk_ai:main"

[build-system]
requires = ["uv_build>=0.13.7,<0.14.0"]
build-backend = "uv_build"
